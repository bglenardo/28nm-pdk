instruments:
  keithley_2401:
    type: Keithley2400
    resource_name: "GPIB0::24::INSTR"
    quantity: Vd

  keithley_e3631a_a:
    type: E3631A
    resource_name: "GPIB0::5::INSTR"
    channel_map:
      P6V: Vb
      P25V: Vg
      N25V: None

  keithley_e3631a_b:
    type: E3631A
    port: COM6
    baudrate: 9600
    timeout_s: 1.0
    # Manual-only primary rails: do not enable them from software.
    channel_map:
      P6V: 0.9V
      P25V: 1.8V
      N25V: None

  bk_9132c:
    type: 9132C
    port: COM10
    baudrate: 9600
    timeout_s: 1.0
    bytesize: 8
    parity: "N"
    stopbits: 1
    write_termination: "\r\n"
    read_termination: "\n"
    set_voltage_cmd: "APPL {channel}, {value:.6f}, {current_limit_a:.6f}"
    current_limit_a: 0.1
    channel_map:
      CH1: vgxn
      CH2: vgxp
      CH3: None

  hp34401a_0v9:
    type: HP34401A
    port: COM8
    baudrate: 9600
    # This 34401A monitors the current through the 0.9 V supply rail (in series
    # on the 0.9 V line). Its front-panel I/O menu is set to 7 data bits + EVEN
    # parity + 2 stop bits (verified by scanning: only 9600 7E2 returns a clean
    # "HEWLETT-PACKARD,34401A,...". 8N1 garbled every byte -> SCPI parse errors
    # and the beep/stall we were chasing). Match the meter exactly.
    supply_rail: "0.9V"
    timeout_s: 3.0
    bytesize: 7
    parity: "E"
    stopbits: 2
    read_termination: "\n"
    write_termination: "\n"
    init_commands:
      # Over RS-232 the meter powers up in LOCAL; without SYST:REM a triggered
      # READ? returns +550 "Command not allowed in local". Enter remote first.
      - "SYST:REM"
      - "*CLS"
      # Silence the beeper so any benign SCPI error does not beep / stall runs.
      - "SYST:BEEP:STAT OFF"
      # "AUTO" is NOT a valid CONF:CURR:DC range parameter on the 34401A
      # (valid: {<range>|MIN|MAX|DEF}); DEF selects autoranging.
      - "CONF:CURR:DC DEF"
      - "SENS:CURR:DC:NPLC 1"
      - "TRIG:SOUR IMM"
      - "TRIG:COUN 1"
      - "SAMP:COUN 1"
    measure_current_cmd: "READ?"
    current_meter: true
    # Supply-current logging disabled 2026-11-11: the 0.9/1.8 V rail currents are
    # extremely consistent device-to-device, so skip them to speed up the scan.
    # 0 => _read_supply_current returns None (Isupply_0V9 column stays blank).
    sample_every_n_points: 0

  agilent34401a_1v8:
    type: HP34401A
    port: COM5
    baudrate: 9600
    # Second 34401A (Agilent-branded, same SCPI as the HP unit) that monitors
    # the current through the 1.8 V supply rail, in series on the 1.8 V line.
    # Verified on COM5 via *IDN? -> "HEWLETT-PACKARD,34401A,..." at 9600 7E2.
    # Its reading is written to the CSV ``Isupply_1V8`` column.
    supply_rail: "1.8V"
    timeout_s: 3.0
    bytesize: 7
    parity: "E"
    stopbits: 2
    read_termination: "\n"
    write_termination: "\n"
    init_commands:
      - "SYST:REM"
      - "*CLS"
      - "SYST:BEEP:STAT OFF"
      - "CONF:CURR:DC DEF"
      - "SENS:CURR:DC:NPLC 1"
      - "TRIG:SOUR IMM"
      - "TRIG:COUN 1"
      - "SAMP:COUN 1"
    measure_current_cmd: "READ?"
    current_meter: true
    # Supply-current logging disabled 2026-11-11 (see note on the 0.9 V meter).
    # 0 => _read_supply_current returns None (Isupply_1V8 column stays blank).
    sample_every_n_points: 0

  arduino_device_switch:
    type: Arduino
    model: NANO_R4
    port: COM11
    # Unified sketch (Arduino/unified_scan_select) runs at 115200 baud.
    baudrate: 115200
    timeout_s: 1.0
    ack_timeout_s: 3.0
    # Firmware requires four fields: flavor, row, col, chip.
    device_select_cmd: "SEL,{flavor_idx},{row_idx},{col_idx},{chip_idx}\n"
